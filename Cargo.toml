[package]
name = "polystrata"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "High-performance 2D polygon clipping, Boolean operations, and topological healing kernel"
homepage = "https://polystrata.ptrbyr.com"
repository = "https://github.com/pboyer/polystrata"
documentation = "https://docs.rs/polystrata"
readme = "README.md"
keywords = [
    "polygon-clipping",
    "boolean-operations",
    "geometry",
    "computational-geometry",
    "cad",
]
categories = ["algorithms", "mathematics", "graphics", "science", "wasm"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/crates/polystrata-wasm/src/**/*",
]

[lib]
path = "crates/polystrata-wasm/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
